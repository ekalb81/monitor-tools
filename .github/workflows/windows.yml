name: Windows validation and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build setup and tray
        shell: powershell
        run: ./Build-Setup.ps1
      - name: Windows PowerShell and executable tests
        shell: powershell
        run: ./tests/Run-AllTests.ps1 -IncludeExecutable
      - name: PowerShell 7 tests
        shell: pwsh
        run: ./tests/Run-AllTests.ps1
      - name: Upload visual test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: build/visual-tests/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-tools-unsigned
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match VERSION.' }
      - name: Build release (optionally signed)
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $certificate = $null
          $pfx = Join-Path $env:RUNNER_TEMP 'monitor-tools-signing.pfx'
          try {
            if ($env:SIGNING_PFX_BASE64) {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
              $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
              $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
              ./Build-Setup.ps1 -SigningCertificateThumbprint $certificate.Thumbprint
            } else {
              ./Build-Setup.ps1
            }
          } finally {
            if ($certificate) { Remove-Item -LiteralPath $certificate.PSPath -Force }
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
          }
      - name: Test release package
        shell: powershell
        run: ./tests/Run-AllTests.ps1 -IncludeExecutable
      - name: Upload release visual test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-visual-test-results
          path: build/visual-tests/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish installer and checksum
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash -LiteralPath dist/Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $pwd 'dist/SHA256SUMS.txt'), "$hash  Setup.exe`n")
          gh release create $env:GITHUB_REF_NAME dist/Setup.exe dist/SHA256SUMS.txt --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
